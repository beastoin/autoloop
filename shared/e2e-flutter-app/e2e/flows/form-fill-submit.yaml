version: 2
name: form-fill-submit
description: Fill name field, toggle switch, and submit the form on marionette test app
app: com.example.marionette_test_app
evidence:
  video: true

steps:
  - id: S1
    name: Verify form elements
    do: Take screenshot and verify all form elements are present
    claim: Form shows name field, switch, and submit button
    expect:
      - milestone: form-elements
        kind: interactive_count
        min: 4
    judge:
      - prompt: Does the app show a text field labeled "Name", a toggle switch "Enable feature", and Submit/Reset buttons?
        screenshot: step-S1
        look_for: [Name, Enable feature, Submit, Reset]
        fail_if: [error, crash, blank]
    evidence:
      - screenshot: step-S1.webp
    verify: true

  - id: S2
    name: Fill name field
    do: Tap the Name text field and type "TestUser"
    claim: Name field contains "TestUser" and display updates
    expect:
      - milestone: name-filled
        kind: text_visible
        values: ["TestUser"]
    judge:
      - prompt: Does the name field show "TestUser" and does the "Name:" display below it update?
        screenshot: step-S2
        look_for: [TestUser, Name:]
        fail_if: [empty field, error]
    evidence:
      - screenshot: step-S2.webp

  - id: S3
    name: Toggle switch
    do: Press the "Enable feature" switch to turn it ON
    claim: Switch toggles to ON position
    judge:
      - prompt: Is the "Enable feature" switch now in the ON position (toggled right/colored)?
        screenshot: step-S3
        look_for: [switch ON, toggle enabled]
        fail_if: [switch OFF, error]
    evidence:
      - screenshot: step-S3.webp

  - id: S4
    name: Submit form
    do: Press the Submit button
    claim: Form submits showing all entered values in status
    expect:
      - milestone: submit-status
        kind: text_visible
        values: ["Submitted"]
    judge:
      - prompt: Does the status text show "Submitted" with the name, switch, and counter values?
        screenshot: step-S4
        look_for: [Submitted, TestUser, switch=true]
        fail_if: [error, Ready, crash]
    evidence:
      - screenshot: step-S4.webp
    verify: true
